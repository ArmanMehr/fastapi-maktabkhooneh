services:
  db:
    image: docker.devneeds.ir/postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dev_db
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dev_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      dockerfile: ./dockerfiles/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/app
      - /usr/app/src/__pycache__
    command: sh -c "alembic upgrade head && fastapi dev --host 0.0.0.0 --port 8000 --reload"
    environment:
      DEBUG: "True"
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://user:pass@db:5432/dev_db
      ENVIRONMENT: development
      PYTHONPATH: /usr/app/src
      AUTH_COOKIE_SECURE: "False"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network


networks:
  app-network:

volumes:
  postgres_data_dev:
