[project]
name = "fastapi-maktabkhooneh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "fastapi-swagger>=0.4.45",
    "fastapi[standard]>=0.135.1, <0.136.0",
    "passlib>=1.7.4",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]


[tool.basedpyright]
typeCheckingMode= "standard"
venvPath = "."
venv = ".venv"
ignore= ["**/__pycache__"]

[[tool.uv.index]]
url = "https://mirror2.chabokan.net/pypi/simple/"
default = true


[tool.pytest.ini_options]
pythonpath = [".", "src"]
